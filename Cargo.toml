[package]
name = "inkbind"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "A helper library for reading, extracting from, and manipulating PDF documents."
repository = "https://github.com/Uysim/inkbind"
documentation = "https://docs.rs/inkbind"
readme = "README.md"
keywords = ["pdf", "parser", "text-extraction", "document"]
categories = ["parser-implementations", "text-processing"]

[dependencies]

[dev-dependencies]
# Step 2 evaluation spike only (see docs/adr/0001-pdf-parsing-approach.md).
# Pinned to the newest release that builds on the 1.75 MSRV; Step 4 promotes
# this to a normal dependency behind inkbind's own types.
lopdf = { version = "=0.32.0", default-features = false, features = ["nom_parser"] }

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
