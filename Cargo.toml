[package]
name = "inkbind"
version = "0.0.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"
description = "A helper library for reading, extracting from, and manipulating PDF documents."
repository = "https://github.com/Uysim/inkbind"
documentation = "https://docs.rs/inkbind"
readme = "README.md"
keywords = ["pdf", "parser", "text-extraction", "document"]
categories = ["parser-implementations", "text-processing"]

[dependencies]
# Low-level PDF parsing / object-model backend (see
# docs/adr/0001-pdf-parsing-approach.md). Pinned to the newest release that
# builds on the 1.75 MSRV. Wrapped behind inkbind's own types in
# src/document.rs — lopdf types never appear in inkbind's public API.
lopdf = { version = "=0.32.0", default-features = false, features = ["nom_parser"] }

[dev-dependencies]
# `rayon` (a default feature) pulls in a `rayon-core` release requiring
# rustc 1.80+, above inkbind's 1.75 MSRV; criterion doesn't need it for the
# non-parallel benchmarking this crate does, so it's dropped.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support", "plotters"] }

[[bench]]
name = "large_pdf"
harness = false

[lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
